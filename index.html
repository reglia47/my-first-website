<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" 
content="width=device-width, initial-scale=1.0">
    <title>我的第一个网站</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <!-- <button onclick="openGoogleTranslate()">日本語</button> -->
        <div class="translate-box" translate="no">
            <label for="targetLanguage">Language:</label>
            <select id="targetLanguage" onchange="openGoogleTranslate()">
                <option value="zh-CN">中文</option>
                <option value="ja">日本語</option>
                <option value="en">English</option>
            </select>
        </div>
        <h1>你好，我是 Seikou</h1>
        <p>这是我亲手制作的第一个网站</p>
    </header>

    <main>
        <section>
            <h2>关于我</h2>
            <p>
                我现在正在学习数学，英语，日语和编程。这个网站是我暑假的第一个编程项目。
            </p>            
        </section>
        <section>
            <h2>我的学习目标</h2>
            <ul>
                <li>学会 HTML / CSS / JavaScript</li>
                <li>做出一个别人能访问的网站</li>
                <li>以后把它变成个人作品集</li>
            </ul>
        </section>
        <section>
            <h2>一个简单的互动功能</h2>
            <button onclick="showMessage()">点击我</button>
            <p id="message"></p>
        </section>
    </main>

    <footer>
        <p>© 2026 Seikou. My first website.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
